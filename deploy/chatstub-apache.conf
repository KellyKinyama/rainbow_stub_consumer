# chatstub Flutter web app — Apache directory config.
# Optional: install into /etc/httpd/conf.d/chatstub.conf (RHEL/OL) or
# /etc/apache2/conf-available/ (Debian) if you don't want to enable
# AllowOverride/.htaccess. Then reload Apache.
#
#   sudo cp deploy/chatstub-apache.conf /etc/httpd/conf.d/chatstub.conf
#   sudo systemctl reload httpd
#
# Requires mod_rewrite (usually loaded by default on RHEL httpd).

<Directory "/var/www/html">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted

    # Flutter web (CanvasKit) ships .wasm assets.
    AddType application/wasm .wasm

    # SPA deep-link fallback: serve index.html for any non-file/non-dir path.
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]
</Directory>
